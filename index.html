<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Keahlian</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header>
  <div>
    <h1>SISTEM KEAHLIAN</h1>
    <p>Pengurusan Pendaftaran Ahli</p>
  </div>
  <span id="connectionStatus" class="status-pill">Menyambung...</span>
</header>

<main class="container">
  <section class="dashboard">
    <div class="card">
      <h3>Jumlah Ahli</h3>
      <div class="jumlah" id="jumlahAhli">0</div>
    </div>
    <div class="card">
      <h3>Ahli Aktif</h3>
      <div class="jumlah" id="jumlahAktif">0</div>
    </div>
    <div class="card">
      <h3>Ahli Terakhir</h3>
      <div class="jumlah small-number" id="ahliTerakhir">-</div>
    </div>
  </section>

  <section class="form-box">
    <div class="section-title">
      <div>
        <h2 id="formTitle">Daftar Ahli Baru</h2>
        <p>Isi maklumat ahli dan tekan Simpan.</p>
      </div>
    </div>

    <form id="borangAhli">
      <input type="hidden" id="editId">

      <div class="grid-2">
        <div class="form-group">
          <label for="namaPenuh">Nama Penuh</label>
          <input id="namaPenuh" type="text" placeholder="Masukkan nama penuh" required>
        </div>

        <div class="form-group">
          <label for="noIC">No. IC</label>
          <input id="noIC" type="text" placeholder="Contoh: 900101-01-1234" required>
        </div>

        <div class="form-group">
          <label for="noTelefon">No. Telefon</label>
          <input id="noTelefon" type="text" placeholder="Contoh: 012-3456789" required>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status">
            <option value="aktif">Aktif</option>
            <option value="tidak aktif">Tidak Aktif</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="alamat">Alamat</label>
        <textarea id="alamat" placeholder="Masukkan alamat penuh" required></textarea>
      </div>

      <div class="button-row">
        <button type="submit" id="btnDaftar">SIMPAN AHLI</button>
        <button type="button" id="btnBatal" class="secondary hidden">BATAL EDIT</button>
      </div>
    </form>

    <div id="message" class="message"></div>
  </section>

  <section class="table-box">
    <div class="table-header">
      <div>
        <h2>Senarai Ahli</h2>
        <p id="jumlahPaparan">0 rekod</p>
      </div>
      <div class="search-row">
        <input id="carian" type="search" placeholder="Cari nama / IC / telefon...">
        <select id="filterStatus">
          <option value="">Semua status</option>
          <option value="aktif">Aktif</option>
          <option value="tidak aktif">Tidak Aktif</option>
        </select>
        <button type="button" id="btnRefresh" class="secondary">Muat Semula</button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>No. Keahlian</th>
            <th>Nama Penuh</th>
            <th>No. IC</th>
            <th>No. Telefon</th>
            <th>Status</th>
            <th>Tarikh Daftar</th>
            <th>Tindakan</th>
          </tr>
        </thead>
        <tbody id="senaraiAhli">
          <tr><td colspan="7" class="center">Sedang memuatkan data...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>

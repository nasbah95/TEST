<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistem Keahlian</title>

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        header p {
            margin: 0;
            opacity: 0.8;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .jumlah {
            font-size: 42px;
            font-weight: bold;
            color: #2563eb;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .form-box h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 7px;
            display: none;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f1f5f9;
        }

        .no-ahli {
            font-weight: bold;
            color: #2563eb;
        }

        @media (max-width: 600px) {
            .container {
                padding: 0 10px;
            }

            th,
            td {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>SISTEM KEAHLIAN</h1>
    <p>Pengurusan Pendaftaran Ahli</p>
</header>

<div class="container">

    <!-- DASHBOARD -->
    <div class="dashboard">

        <div class="card">
            <h3>Jumlah Ahli Berdaftar</h3>
            <div class="jumlah" id="jumlahAhli">0</div>
        </div>

        <div class="card">
            <h3>Keahlian Terakhir</h3>
            <div class="jumlah" id="ahliTerakhir">-</div>
        </div>

    </div>


    <!-- BORANG PENDAFTARAN -->
    <div class="form-box">

        <h2>Daftar Ahli Baru</h2>

        <form id="borangAhli">

            <div class="form-group">
                <label for="namaPenuh">
                    Nama Penuh
                </label>

                <input
                    type="text"
                    id="namaPenuh"
                    placeholder="Masukkan nama penuh"
                    required
                >
            </div>


            <div class="form-group">
                <label for="noIC">
                    No. IC
                </label>

                <input
                    type="text"
                    id="noIC"
                    placeholder="Contoh: 900101-01-1234"
                    required
                >
            </div>


            <div class="form-group">
                <label for="noTelefon">
                    No. Telefon
                </label>

                <input
                    type="text"
                    id="noTelefon"
                    placeholder="Contoh: 012-3456789"
                    required
                >
            </div>


            <div class="form-group">
                <label for="alamat">
                    Alamat
                </label>

                <textarea
                    id="alamat"
                    placeholder="Masukkan alamat penuh"
                    required
                ></textarea>
            </div>


            <button type="submit" id="btnDaftar">
                DAFTAR AHLI
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>


    <!-- SENARAI AHLI -->
    <div class="table-box">

        <h2>Senarai Ahli</h2>

        <table>

            <thead>
                <tr>
                    <th>No. Keahlian</th>
                    <th>Nama Penuh</th>
                    <th>No. IC</th>
                    <th>No. Telefon</th>
                    <th>Alamat</th>
                </tr>
            </thead>

            <tbody id="senaraiAhli">
                <tr>
                    <td colspan="5">
                        Sedang memuatkan data...
                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>


<script>

    // =====================================================
    // SUPABASE
    // =====================================================

    const SUPABASE_URL = "MASUKKAN_SUPABASE_URL_ANDA";

    const SUPABASE_ANON_KEY = "MASUKKAN_SUPABASE_ANON_KEY_ANDA";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


    // =====================================================
    // ELEMENT
    // =====================================================

    const borang = document.getElementById("borangAhli");

    const jumlahAhli = document.getElementById("jumlahAhli");

    const ahliTerakhir = document.getElementById("ahliTerakhir");

    const senaraiAhli = document.getElementById("senaraiAhli");

    const message = document.getElementById("message");

    const btnDaftar = document.getElementById("btnDaftar");


    // =====================================================
    // PAPAR MESEJ
    // =====================================================

    function paparMesej(teks, jenis) {

        message.textContent = teks;

        message.className = "message " + jenis;

    }


    // =====================================================
    // DAPATKAN JUMLAH AHLI
    // =====================================================

    async function kemaskiniJumlah() {

        const { count, error } = await supabaseClient
            .from("ahli")
            .select("*", {
                count: "exact",
                head: true
            });

        if (error) {

            console.error(error);

            jumlahAhli.textContent = "0";

            return;
        }

        jumlahAhli.textContent = count || 0;
    }


    // =====================================================
    // PAPAR SENARAI AHLI
    // =====================================================

    async function muatkanAhli() {

        const { data, error } = await supabaseClient
            .from("ahli")
            .select("*")
            .order("no_ahli", {
                ascending: false
            });

        if (error) {

            console.error(error);

            senaraiAhli.innerHTML = `
                <tr>
                    <td colspan="5">
                        Gagal mendapatkan data ahli.
                    </td>
                </tr>
            `;

            return;
        }


        if (!data || data.length === 0) {

            senaraiAhli.innerHTML = `
                <tr>
                    <td colspan="5">
                        Belum ada ahli berdaftar.
                    </td>
                </tr>
            `;

            ahliTerakhir.textContent = "-";

            return;
        }


        // No ahli terbaru
        const terbaru = data[0].no_ahli;

        ahliTerakhir.textContent =
            "SW-" + String(terbaru).padStart(5, "0");


        // Papar jadual
        senaraiAhli.innerHTML = "";

        data.forEach(ahli => {

            const noAhli =
                "SW-" +
                String(ahli.no_ahli).padStart(5, "0");


            const row = document.createElement("tr");

            row.innerHTML = `

                <td class="no-ahli">
                    ${noAhli}
                </td>

                <td>
                    ${escapeHTML(ahli.nama_penuh)}
                </td>

                <td>
                    ${escapeHTML(ahli.no_ic)}
                </td>

                <td>
                    ${escapeHTML(ahli.no_telefon)}
                </td>

                <td>
                    ${escapeHTML(ahli.alamat)}
                </td>

            `;

            senaraiAhli.appendChild(row);

        });

    }


    // =====================================================
    // KESELAMATAN PAPARAN TEXT
    // =====================================================

    function escapeHTML(text) {

        if (!text) return "";

        return String(text)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // =====================================================
    // DAFTAR AHLI
    // =====================================================

    borang.addEventListener("submit", async function(event) {

        event.preventDefault();


        const nama = document.getElementById("namaPenuh").value.trim();

        const noIC = document.getElementById("noIC").value.trim();

        const telefon = document.getElementById("noTelefon").value.trim();

        const alamat = document.getElementById("alamat").value.trim();


        if (!nama || !noIC || !telefon || !alamat) {

            paparMesej(
                "Sila lengkapkan semua maklumat.",
                "error"
            );

            return;
        }


        btnDaftar.disabled = true;

        btnDaftar.textContent = "SEDANG MENDAFTAR...";


        try {

            // Masukkan data
            // NO KEAHLIAN TIDAK PERLU DIMASUKKAN
            // SUPABASE AKAN MENJANA SECARA AUTOMATIK

            const { data, error } = await supabaseClient
                .from("ahli")
                .insert([
                    {
                        nama_penuh: nama,
                        no_ic: noIC,
                        no_telefon: telefon,
                        alamat: alamat
                    }
                ])
                .select()
                .single();


            if (error) {

                console.error(error);

                if (
                    error.code === "23505" ||
                    error.message.includes("duplicate")
                ) {

                    throw new Error(
                        "No. IC ini sudah didaftarkan."
                    );

                }

                throw new Error(
                    "Pendaftaran gagal. Sila semak sambungan Supabase."
                );
            }


            const noAhli =
                "SW-" +
                String(data.no_ahli).padStart(5, "0");


            paparMesej(
                "Pendaftaran berjaya! No. Keahlian anda ialah " +
                noAhli,
                "success"
            );


            // Kosongkan borang
            borang.reset();


            // Kemaskini dashboard
            await kemaskiniJumlah();

            await muatkanAhli();


        } catch (error) {

            console.error(error);

            paparMesej(
                error.message,
                "error"
            );

        } finally {

            btnDaftar.disabled = false;

            btnDaftar.textContent = "DAFTAR AHLI";

        }

    });


    // =====================================================
    // MULA SISTEM
    // =====================================================

    async function mulaSistem() {

        await kemaskiniJumlah();

        await muatkanAhli();

    }


    mulaSistem();

</script>

</body>
</html>
